start:
  message_ar: "أهلاً بيك في دليل 'هل تستحق؟' 🤝 أقدر أساعدك تعرف كل برامج الحماية والدعم الرسمية وإزاي توصل للجهة المسؤولة. تحب تستفسر عن إيه؟"
  options:
    - id: "takaful"
      label_ar: "دعم نقدي (تكافل وكرامة)"
      goto: "takaful"
    - id: "rations"
      label_ar: "دعم السلع التموينية ورغيف العيش"
      goto: "rations"
    - id: "health_insurance"
      label_ar: "التأمين الصحي الشامل وعلاج غير القادرين"
      goto: "health_insurance"
    - id: "students_support"
      label_ar: "دعم الطلبة (تأمين ومواصلات وتغذية)"
      goto: "students_support"
    - id: "sme_support"
      label_ar: "حوافز المشروعات الصغيرة وأصحاب الأعمال"
      goto: "sme_support"

takaful:
  title_ar: "برنامج تكافل وكرامة"
  info_ar: "برنامج تكافل وكرامة بيقدم دعم نقدي مشروط للأسر الأولى بالرعاية، كبار السن، ذوي الإعاقة، والأيتام. في موازنة 2026/2027 مخصصله 55.2 مليار جنيه ويستفيد منه حوالي 4.7 مليون أسرة."
  action_ar: "التقديم والاستعلام بيكون من خلال التوجه لأقرب وحدة شؤون اجتماعية تابعة لمحل سكنك أو عبر الموقع الرسمي لوزارة التضامن الاجتماعي."
  official_channel: "وزارة التضامن الاجتماعي: moss.gov.eg | الخط الساخن 19680 | أقرب وحدة تضامن اجتماعي"
  disclaimer_ar: "ℹ️ دي معلومة استرشادية — القرار النهائي واستيفاء الشروط بيكون من خلال الجهة الرسمية المختصة فقط دون أي تدخل آلي."

rations:
  title_ar: "دعم السلع التموينية والخبز المدعم"
  info_ar: "دعم السلع التموينية ورغيف العيش في موازنة 2026/2027 مخصصله 178.3 مليار جنيه بزيادة 11.4%، ويستفيد منه أكتر من 60 مليون مواطن."
  action_ar: "الاستعلام عن بيانات البطاقة التموينية أو بدل الفاقد والتالف من خلال بوابة مصر الرقمية أو مكاتب التموين ومراكز الخدمة المطورة."
  official_channel: "بوابة مصر الرقمية (digital.gov.eg) | الخط الساخن لوزارة التموين: 19959"
  disclaimer_ar: "ℹ️ دي معلومة استرشادية — القرار النهائي والتحقق من الاستحقاق بيكون من وزارة التموين."

health_insurance:
  title_ar: "التأمين الصحي الشامل ودعم غير القادرين"
  info_ar: "منظومة التأمين الصحي الشامل بتتطبق تدريجيًا على محافظات الجمهورية، والخزانة العامة للدولة بتتحمل اشتراكات غير القادرين بالكامل بمخصصات تبلغ 15.7 مليار جنيه بموازنة 2026/2027."
  action_ar: "التسجيل في المنظومة وفتح الملف العائلي يتم بالتوجه لأقرب وحدة صحية أو مركز طب أسرة تابع لمحافظتك التي دخلت المنظومة."
  official_channel: "الهيئة العامة للتأمين الصحي الشامل: uhia.gov.eg | الخط الساخن: 15344"
  disclaimer_ar: "ℹ️ دي معلومة استرشادية — التسجيل وتحديد غير القادرين يتم عبر اللجان الرسمية المشتركة."

students_support:
  title_ar: "دعم الطلاب والتلاميذ"
  info_ar: "تشمل موازنة 2026/2027 دعم التأمين الصحي للطلاب بقيمة 390 مليون جنيه، والتغذية المدرسية بـ 7 مليارات جنيه، بجانب دعم اشتراكات قطارات السكك الحديدية ومترو الأنفاق."
  action_ar: "للاشتراكات المخفضة للمواصلات، يتم استيفاء استمارة الاشتراك من محطات المترو/القطار واعتمادها من شؤون الطلاب بالجامعة أو المدرسة."
  official_channel: "مكاتب اشتراكات الهيئة القومية لسكك حديد مصر ومترو الأنفاق | الإدارة التعليمية"
  disclaimer_ar: "ℹ️ دي معلومة استرشادية — التخفيضات والخدمات متاحة للطلاب المنتظمين بموجب إثبات القيد."

sme_support:
  title_ar: "حوافز المشروعات وريادة الأعمال"
  info_ar: "توفر الموازنة 5 مليارات جنيه حوافز نقدية للمشروعات الصغيرة وريادة الأعمال، و6 مليارات جنيه تسهيلات تمويلية لقطاعات الإنتاج، مع منظومة ضريبية مبسطة تستهدف 100 ألف ممول جديد."
  action_ar: "يمكن لأصحاب المشروعات التقدم للاستفادة من الحوافز والتيسيرات الضريبية وتوفيق الأوضاع عبر فروع جهاز تنمية المشروعات أو مصلحة الضرائب."
  official_channel: "جهاز تنمية المشروعات (msmeda.org.eg) - 16733 | مصلحة الضرائب (eta.gov.eg) - 16395"
  disclaimer_ar: "ℹ️ دي معلومة استرشادية — الشروط واللوائح التنفيذية معلنة عبر جهاز تنمية المشروعات والضرائب."
